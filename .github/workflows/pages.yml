name: Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write # push to the gh-pages branch
  pull-requests: write # comment the preview URL

jobs:
  pages:
    name: Pages
    uses: allonsy-studio/.github/.github/workflows/pages.yml@main
    with:
      build-command: yarn docs:build
      output-dir: preview/_site
      node-version-file: .nvmrc
